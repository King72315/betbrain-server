# Live production web service in the Render dashboard is betbrain-server-1.
# Blueprint name below remains betbrain-api — do NOT rename via Blueprint sync
# (that can create a second web service). Filesystem is production primary;
# no CourtEdge Postgres database dependency in this restore build.
services:
  - type: web
    name: betbrain-api
    env: node
    plan: free
    branch: betbrain-v2-rebuild
    rootDir: betbrain-server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPORTS_KEY
        sync: false
      - key: ODDS_KEY
        sync: false
      - key: BALLDONTLIE_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: COURTEDGE_SCHEDULER_TOKEN
        sync: false
      - key: COURTEDGE_TIMEZONE
        value: America/Chicago
      - key: COURTEDGE_SCHEDULER_ENABLED
        value: "true"
      - key: COURTEDGE_LAB_WIPE_V1
        value: "false"
      - key: COURTEDGE_HISTORY_REBUILD_V1
        value: "false"
      - key: COURTEDGE_ENGINE_EXPANSION_V1_ENABLED
        value: "true"
      - key: EMPIRICAL_SAFE_PROP_V2
        value: "true"
      - key: COURTEDGE_ALLOW_LOCKED_SLATE_REFRESH
        value: "false"

  # Dispatcher only — server decides which jobs are due.
  # Render Cron Job must be created in dashboard if Blueprint cron is unavailable on plan.
  - type: cron
    name: courtedge-scheduler-cron
    env: node
    plan: starter
    branch: betbrain-v2-rebuild
    rootDir: betbrain-server
    buildCommand: npm install
    startCommand: node scripts/runCourtEdgeSchedulerCron.js
    schedule: "*/15 * * * *"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COURTEDGE_SERVER_URL
        value: https://betbrain-server-1.onrender.com
      - key: COURTEDGE_SCHEDULER_TOKEN
        sync: false
      - key: COURTEDGE_TIMEZONE
        value: America/Chicago
      - key: COURTEDGE_SCHEDULER_TIMEOUT_MS
        value: "120000"
