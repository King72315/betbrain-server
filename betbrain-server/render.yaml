# IMPORTANT: Live production service is currently named betbrain-server-1 in the
# Render dashboard. Blueprint service name below is betbrain-api. If Blueprint
# sync does not attach DATABASE_URL to betbrain-server-1, link courtedge-durable-db
# manually on that service. Without DATABASE_URL, durableStoreReady stays false.
services:
  - type: web
    name: betbrain-api
    env: node
    plan: free
    branch: betbrain-v2-rebuild
    rootDir: betbrain-server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPORTS_KEY
        sync: false
      - key: ODDS_KEY
        sync: false
      - key: BALLDONTLIE_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: COURTEDGE_SCHEDULER_TOKEN
        sync: false
      - key: COURTEDGE_TIMEZONE
        value: America/Chicago
      - key: COURTEDGE_SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: courtedge-durable-db
          property: connectionString
      - key: COURTEDGE_LAB_WIPE_V1
        value: "false"
      - key: COURTEDGE_HISTORY_REBUILD_V1
        value: "false"
      - key: COURTEDGE_ENGINE_EXPANSION_V1_ENABLED
        value: "true"
      - key: EMPIRICAL_SAFE_PROP_V2
        value: "true"
      - key: COURTEDGE_ALLOW_LOCKED_SLATE_REFRESH
        value: "false"
      - key: COURTEDGE_ALLOW_FS_PROD
        value: "false"

  # Dispatcher only — server decides which jobs are due.
  # Render Cron Job must be created in dashboard if Blueprint cron is unavailable on plan.
  - type: cron
    name: courtedge-scheduler-cron
    env: node
    plan: starter
    branch: betbrain-v2-rebuild
    rootDir: betbrain-server
    buildCommand: npm install
    startCommand: node scripts/runCourtEdgeSchedulerCron.js
    schedule: "*/15 * * * *"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COURTEDGE_SERVER_URL
        value: https://betbrain-server-1.onrender.com
      - key: COURTEDGE_SCHEDULER_TOKEN
        sync: false
      - key: COURTEDGE_TIMEZONE
        value: America/Chicago
      - key: COURTEDGE_SCHEDULER_TIMEOUT_MS
        value: "120000"

databases:
  - name: courtedge-durable-db
    plan: basic-256mb
