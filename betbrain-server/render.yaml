services:
  - type: web
    name: betbrain-api
    env: node
    plan: free
    branch: betbrain-v2-rebuild
    rootDir: betbrain-server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPORTS_KEY
        sync: false
      - key: ODDS_KEY
        sync: false
      - key: BALLDONTLIE_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: COURTEDGE_ARCHIVE_LAB_0621_V1
        value: "true"
